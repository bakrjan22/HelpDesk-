    <title>HelpDesk</title>

<body>
    <header class="header-nav">
        <nav class="nav-bare">
            <div class="logo-container">
                <div class="logo">
                    <p>H</p>
                </div>
                <h1>HelpDesk</h1>
            </div>
            <h2>Atlas Solutions  /  Support</h2>
        </nav>
    </header>

    <main>
        <section class="dashboard-container">
            <div class="top-dashboard">
                <h2>Gestion des demandes</h2>
                <h3>Centralisez les incidents et simplifiez le suivi de votre équipe.</h3>
            </div>
            <div class="card-container">
                <div class="card-content-box">
                    <h2>Créer une demande</h2>
                    <h3>Décrivez votre problème informatique en quelques étapes.</h3>
                    <form class="deep-content-form">
                        
                        <div class="form-field title-issue">
                            <p>Titre du problème *</p>
                            <input type="text" id="issue_title" placeholder="Connexion Wi-Fi instable">
                        </div>

                        <div class="form-field type">
                            <p>Catégorie *</p>
                            <select name="" id="Categorie" class="Categorie-class">
                                <option value="" disabled selected>Choisir une option</option>
                                <option value="Réseau" class="option-dropdown">Réseau</option>
                                <option value="Materiele" class="option-dropdown">Materiel</option>
                                <option value="Logiciel" class="option-dropdown">Logiciel</option>
                            </select>
                        </div>

                        <div class="form-field Priority">
                            <p>Priorité *</p>
                            <select name="" id="Priorite">
                                <option value="" disabled selected>Choisir une option</option>
                                <option value="Basse">Basse</option>
                                <option value="Normale">Normale</option>
                                <option value="Haute">Haute</option>
                            </select>
                        </div>

                        <div class="form-field desc">
                            <p>Description *</p>
                            <input type="text" id="description" placeholder="Décrivez le problème informatique rencontré...">
                        </div>
                    </form>
                    <p class="info_submit" id="info_submit"></p>
                    <div class="submit-area">
                        <button id="submit" onclick="request_issue()">＋  Ajouter la demande</button>
                    </div>
                </div>
            </div>

            <section class="demandes">
                <div class="demandes-top-area">
                    <div class="demandes-top-left" id="demandes-top-left-id">
                        <div class="list-demandes">
                            <h2>Liste des demandes</h2>
                            <h3 id="task-count">0 demandes</h3>
                        </div>
                    </div>
                    
                    <div class="demande-top-right" id="card-or-array">
                        <div class="demande-top-right-content">
                        
                            <div class="demande-top-right-content-button">
                                <button id="card-button" onclick="display_method.toggle_cartes()">
                                    <div>
                                        <i class="fa-solid fa-table-cells-large" style="color: rgb(32, 42, 56);"></i>
                                        Cartes
                                    </div>
                                </button>
                                <button id="tableau-button" onclick="display_method.toggle_tableau()">
                                    <div>
                                        <i class="fa-solid fa-grip-vertical shared-style"></i>
                                        Tableau
                                    </div>
                                </button>
                                
                            </div>
                        </div>
                    </div>

                </div>
            </section>

            <section class="demandes-display" id="id-demandes-display">
